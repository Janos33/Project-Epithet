services:
  neo4j:
    image: neo4j:5.26-community
    container_name: poem_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 80s

  build-database:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: python build_database.py
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PYTHONUNBUFFERED=1
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/code/data

  generate-dataset:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: python generate_dataset.py
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PYTHONUNBUFFERED=1
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/code/data

  app:
    build:
      context: ./app
    command: python main.py
    ports:
      - "${APP_PORT:-8000}:5000"
    volumes:
      - ./data:/code/data
    develop:
      watch:
        - action: sync
          path: ./app
          target: /code
        - action: rebuild
          path: ./app/requirements.txt

volumes:
  neo4j_data:
