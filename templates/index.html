<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Epithet</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <div>
        <h1 style="text-align: center;">Project Epithet</h1>
        
        <!-- CRITICAL: enctype is required to upload files -->
        <form action="/results" method="POST" enctype="multipart/form-data">
            
            <div class="form-content">
                <h2 style="text-align: center;">Write something into the text area or upload a file</h2> 
                
                <!-- New flex container to hold text and file side-by-side -->
                <div class="input-group">
                    <textarea name="user_text" id="user_text" rows="25" cols="75"></textarea>
                    
                    <!-- File Drop Zone -->
                    <div class="file-drop-zone">
                        <span>Pull file here<br>or click to browse</span>
                        <input type="file" name="user_file" id="user_file">
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button type="submit" id="generate_button">Find your words</button>
                </div>
            </div>
            
        </form>
    </div>

</body>
</html>
